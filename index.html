<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Administrasi Guru & Pembelajaran</title>
    <meta name="description" content="Aplikasi pengelolaan presensi harian siswa, jurnal mengajar, pengolahan nilai sumatif, penjadwalan pelajaran, catatan kejadian murid, dan jadwal penggunaan ruang multimedia." />
    <meta property="og:title" content="Sistem Administrasi Guru & Pembelajaran" />
    <meta property="og:description" content="Aplikasi pengelolaan presensi harian siswa, jurnal mengajar, pengolahan nilai sumatif, penjadwalan pelajaran, catatan kejadian murid, dan jadwal penggunaan ruang multimedia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- GitHub Pages Trailing Slash Fix: Mencegah error 404 pada aset relatif (./assets/...) -->
    <script>
      (function() {
        var loc = window.location;
        if (loc.pathname && loc.pathname.length > 1 && !loc.pathname.endsWith('/') && !loc.pathname.split('/').pop().includes('.')) {
          loc.replace(loc.pathname + '/' + loc.search + loc.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <!-- Tampilan awal saat bundle JS sedang diunduh atau jika terjadi kendala jaringan -->
      <div id="initial-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3.5px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: preloader-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 1.15rem; font-weight: 600; margin: 0 0 8px 0; color: #ffffff;">Memuat Sistem Administrasi Guru...</h2>
        <p style="font-size: 0.875rem; color: #94a3b8; max-width: 400px; margin: 0 0 16px 0; line-height: 1.5;">SD IT AN-NUUR • Menyiapkan antarmuka dan modul pembelajaran.</p>
        <div id="preloader-hint" style="display: none; font-size: 0.8rem; color: #cbd5e1; max-width: 460px; background: #1e293b; padding: 14px 18px; border-radius: 10px; border: 1px solid #334155; margin-top: 10px; line-height: 1.5;">
          <p style="margin: 0 0 8px 0; color: #38bdf8; font-weight: 600;">Memerlukan waktu lebih lama?</p>
          <p style="margin: 0 0 10px 0;">Jika Anda melihat pesan ini di GitHub Pages, pastikan deployment berasal dari folder <strong>dist/</strong> (menggunakan GitHub Actions atau branch <code>gh-pages</code>).</p>
          <button onclick="window.location.reload()" style="background: #2563eb; color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer;">
            Muat Ulang Halaman
          </button>
        </div>
      </div>
      <style>
        @keyframes preloader-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var hint = document.getElementById('preloader-hint');
          if (hint) hint.style.display = 'block';
        }, 4500);
      </script>
    </div>

    <noscript>
      <div style="padding: 24px; text-align: center; background: #991b1b; color: white; font-family: sans-serif;">
        Peramban Anda menonaktifkan JavaScript. Aktifkan JavaScript untuk membuka Sistem Administrasi Guru SD IT AN-NUUR.
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
